# Yarn 4.18 no longer runs install scripts by default, and better-sqlite3 needs its build step.
enableScripts: true

enableTelemetry: false

nodeLinker: node-modules

# Allow only packages older than 14 days (in minutes). Schema declares that "14d" can be entered, but that doesn't have any effect.
npmMinimalAgeGate: 20160

npmPreapprovedPackages:
  - "@evolu/*"
  # internal packages are OK, TODO remove after 13th August 2026
  - "@trezor/*"
  # ESLint 10.11.0 was taken before its 14-day window ended. Can be removed after 2026-10-02
  - "eslint@10.11.0"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
